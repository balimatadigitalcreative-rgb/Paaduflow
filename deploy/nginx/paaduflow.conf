# Nginx — paaduflow.com
#
# Berkas ini terversi di repo supaya konfigurasi produksi tidak hanya hidup di
# satu server yang tidak ada yang ingat cara menyusunnya kembali.
#
# Memasang:
#   sudo cp deploy/nginx/paaduflow.conf /etc/nginx/sites-available/paaduflow
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Baris bertanda "managed by Certbot" berasal dari certbot dan harus dibiarkan
# apa adanya — certbot menyuntingnya kembali saat memperbarui sertifikat.

# ═══════════════════════════════════════════════════════════════════════════
#   UPSTREAM
#
#   PM2 mode cluster mengikat SATU porta di proses master; seluruh worker
#   menerima koneksi dari soket yang sama. Nginx karena itu hanya melihat satu
#   alamat, betapa pun banyaknya worker.
#
#   Alamat yang sama sengaja ditulis DUA KALI. Itu bukan salah salin.
#
#   `proxy_next_upstream` bekerja dengan berpindah ke peer BERIKUTNYA dalam
#   daftar. Dengan satu peer, tidak ada peer berikutnya: nginx menandai peer itu
#   gagal dan langsung memulangkan 502. Dengan dua entri, percobaan kedua
#   membuka koneksi BARU ke soket yang sama — dan master PM2 menyerahkannya ke
#   worker yang sehat.
#
#   Yang ditolong: worker yang mati di tengah permintaan. Yang TIDAK ditolong:
#   master PM2 yang mati — saat itu kedua entri gagal, dan memang seharusnya
#   gagal.
#
#   Perlu dikatakan terus terang: bagian ini sekunder. Yang benar-benar membuat
#   deploy tidak memutus layanan adalah mode cluster dan penutupan yang rapi;
#   soketnya tidak pernah tertutup, dan worker menyelesaikan permintaannya
#   sebelum keluar. Retry di sini menjaring sisanya.
# ═══════════════════════════════════════════════════════════════════════════
upstream paadu_api {
    server 127.0.0.1:3000 max_fails=0;
    server 127.0.0.1:3000 max_fails=0;

    # Koneksi upstream dipakai ulang. Tanpa ini setiap permintaan membuka soket
    # TCP baru ke aplikasi, dan saat reload jumlah soket setengah-terbuka
    # melonjak tepat ketika prosesnya sedang sibuk menutup diri.
    #
    # Sisi aplikasi menutup koneksi keep-alive yang MENGANGGUR saat penutupan
    # (`forceCloseConnections: 'idle'`), jadi koneksi yang dipakai ulang di sini
    # tidak pernah menahan penutupan.
    keepalive 32;
    keepalive_timeout 60s;
}

# Menjaga dukungan WebSocket tetap hidup berdampingan dengan keepalive upstream.
#
# Keepalive menuntut header `Connection` kosong; upgrade menuntutnya berisi
# "upgrade". Peta ini memilihkan yang benar per permintaan, alih-alih memaksa
# salah satunya dan diam-diam mematikan yang lain.
map $http_upgrade $paadu_connection {
    default upgrade;
    ''      '';
}

server {
    server_name paaduflow.com www.paaduflow.com;

    location / {
        proxy_pass http://paadu_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $paadu_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ─────────────────────────────────────────────────────────────────────
        #   RETRY
        #
        #   `non_idempotent` sengaja TIDAK ada di daftar ini.
        #
        #   Tanpanya, nginx hanya mengulang permintaan yang belum sempat
        #   terkirim, dan tidak pernah mengulang POST/PUT/PATCH yang sudah
        #   sampai ke aplikasi. Itu yang benar di sini: mengulang
        #   `POST …/sales-documents/:id/post` yang sebenarnya sudah diproses
        #   dapat memposting faktur dua kali. `Idempotency-Key` melindungi hal
        #   itu hanya bila kliennya mengirimkannya — dan nginx tidak dapat tahu
        #   apakah ia mengirimkannya.
        #
        #   Uang pelanggan lebih berharga daripada satu galat yang terlihat.
        # ─────────────────────────────────────────────────────────────────────
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # Koneksi ke soket yang sudah mati harus gagal cepat, supaya percobaan
        # kedua sempat berjalan di dalam anggaran waktu permintaannya.
        proxy_connect_timeout 2s;

        # Ekor terukur di produksi 3,3 detik (login argon2 saat threadpool
        # libuv penuh). Tiga puluh detik memberi ruang jauh di atasnya tanpa
        # membiarkan permintaan menggantung selamanya.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/paaduflow.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/paaduflow.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.paaduflow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = paaduflow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name paaduflow.com www.paaduflow.com;
    return 404; # managed by Certbot
}
